name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration:orders
      - name: Use PostgreSQL 17 backup tools from the tested service image
        run: |
          mkdir -p "$RUNNER_TEMP/postgres-bin"
          cat > "$RUNNER_TEMP/postgres-bin/pg_dump" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:17 "$(basename "$0")" "$@"
          SCRIPT
          chmod 755 "$RUNNER_TEMP/postgres-bin/pg_dump"
          cp "$RUNNER_TEMP/postgres-bin/pg_dump" "$RUNNER_TEMP/postgres-bin/pg_restore"
          "$RUNNER_TEMP/postgres-bin/pg_dump" --version
          "$RUNNER_TEMP/postgres-bin/pg_restore" --version
      - run: node --import tsx scripts/verify-screenshot-restore.ts
        env:
          POSTGRES_BIN: ${{ runner.temp }}/postgres-bin
          TMPDIR: ${{ runner.temp }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
